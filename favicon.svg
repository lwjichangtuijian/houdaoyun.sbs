<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="glacierGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#244E60"/>
      <stop offset="50%" stop-color="#25B7B8"/>
      <stop offset="100%" stop-color="#E8FDFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#25B7B8" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- 背景圆角矩形：深海蓝 #142C3E -->
  <rect width="64" height="64" rx="16" fill="#142C3E"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(37, 183, 184, 0.4)" stroke-width="1.5"/>

  <!-- 厚道云品牌云纹与高速连接几何徽标 -->
  <g filter="url(#shadow)">
    <!-- 动态专线轨道环 -->
    <path d="M14 36 C14 27 21 20 30 20 C35 20 39.5 22.5 42 26 C44.5 24 48 24.5 50 27 C52.5 30 52 35 49 37 C51 38.5 51.5 42 49 44 C46.5 46 41 46 36 46 L20 46 C15.5 46 14 41.5 14 36 Z" fill="url(#glacierGrad)"/>
    
    <!-- 内部光速流线与"厚"字几何意象：纯白 -->
    <path d="M22 34 L42 34" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M26 28 L38 28" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.95"/>
    <path d="M28 34 L28 41 L36 41" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="39" cy="40.5" r="1.8" fill="#ffffff"/>
  </g>
</svg>