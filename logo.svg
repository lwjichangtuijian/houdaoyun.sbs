<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56">
  <defs>
    <linearGradient id="logoIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#244E60"/>
      <stop offset="60%" stop-color="#25B7B8"/>
      <stop offset="100%" stop-color="#E8FDFF"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8FDFF"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#25B7B8" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 图标徽标 (44x44) 背景：深海蓝 #142C3E -->
  <g transform="translate(6, 6)">
    <rect width="44" height="44" rx="12" fill="#142C3E"/>
    <rect width="42" height="42" x="1" y="1" rx="11" fill="none" stroke="rgba(37, 183, 184, 0.45)" stroke-width="1.2"/>
    <g filter="url(#logoGlow)">
      <!-- 云朵与光纤互联拓扑 -->
      <path d="M10 25 C10 18.5 15 13.5 22 13.5 C25.8 13.5 29.2 15.3 31 18 C33 16.5 35.5 17 37 19 C38.8 21.2 38.5 24.8 36.5 26.2 C38 27.5 38.5 30 36.8 31.8 C35 33.2 31 33.2 27 33.2 L14 33.2 C10.8 33.2 10 29.8 10 25 Z" fill="url(#logoIconGrad)"/>
      <!-- 内部几何线条 -->
      <path d="M16 23.5 L31 23.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <path d="M19 19 L28 19" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.95"/>
      <path d="M21 23.5 L21 29 L27 29" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="29.5" cy="28.5" r="1.4" fill="#ffffff"/>
    </g>
  </g>

  <!-- 品牌文字 "厚道云" + "HOUDAOYUN" -->
  <g transform="translate(62, 0)">
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="22" font-weight="800" fill="url(#textGrad)" letter-spacing="0.5">厚道云</text>
    <text x="70" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#25B7B8" letter-spacing="1.5">PRO</text>
    <text x="0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#B8D5E5" letter-spacing="2.2">HOUDAOYUN SPEED</text>
  </g>
</svg>